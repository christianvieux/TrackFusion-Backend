name: TrackFusionWeb API CI/CD

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trackfusionweb-api-${{ github.workflow }}-${{ github.ref }}
  # Production plans/applies must finish or fail under the Terraform lock. A
  # later manual dispatch waits instead of cancelling an in-flight apply.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: trackfusionweb_db
          POSTGRES_USER: trackfusion
          POSTGRES_PASSWORD: trackfusionweb-api-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackfusion -d trackfusionweb_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 8081
      REQUEST_BODY_LIMIT: 1mb
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_SECRET: ci-session-secret-000000000000000000000000
      JWT_SECRET: ci-jwt-secret-000000000000000000000000000
      DATABASE_URL: postgresql://trackfusion:trackfusionweb-api-ci-password@127.0.0.1:5432/trackfusionweb_db
      REDIS_URL: redis://127.0.0.1:6379
      PYTHON_EXECUTABLE: python
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: trackfusionweb-api-ci-placeholder
      STORAGE_PROVIDER: aws-s3
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      EMAIL_PROVIDER: disabled
      EMAIL_DELIVERY_ENABLED: "false"
      EMAIL_VALIDATE_MX: "false"
      EXPOSE_OTP_IN_DEVELOPMENT: "false"
      EXPOSE_RESET_TOKEN_IN_DEVELOPMENT: "false"
      AUDIO_MAX_LENGTH: 900
      AUDIO_MAX_FILE_SIZE: 300
      IMAGE_MAX_FILE_SIZE: 50
      ALLOWED_AUDIO_TYPES: audio/mp3,audio/wav,audio/mpeg,audio/ogg
      ALLOWED_IMAGE_TYPES: image/jpeg,image/png
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit and Python syntax tests
        run: |
          npm test -- --runInBand
          bash deploy/ec2/tests/environment-config.test.sh
          bash deploy/ec2/tests/parameter-store-reconciliation.test.sh
          bash deploy/ec2/tests/deployment-safety.test.sh
          python -m compileall -q python

      - name: Verify database schema and live API
        run: |
          npm run db:init
          npm run db:verify
          npm start > /tmp/trackfusionweb-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat /tmp/trackfusionweb-api.log
              exit 1
            fi
            sleep 1
          done
          npm run smoke

  docker:
    name: Build production image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --tag "trackfusionweb-api:${GITHUB_SHA}" .

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Initialize without the remote backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=infrastructure/terraform validate -no-color

  production-preflight:
    name: Verify production protections
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [test, docker, terraform]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Fail closed unless GitHub environments are protected
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verifyProductionEnvironments.js

  terraform-plan:
    name: Plan production infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: production-preflight
    environment:
      name: production-plan
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "020457827871"
      TERRAFORM_VERSION: 1.17.0
      TF_IN_AUTOMATION: "true"
      TF_VAR_developer_ssh_cidr: ${{ vars.DEVELOPER_SSH_CIDR }}
    outputs:
      artifact_name: ${{ steps.identify.outputs.artifact_name }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure read-only Terraform credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/TrackFusionWeb-GitHub-Terraform-Plan_Role
          role-session-name: TrackFusionWeb-Plan-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Account --output text | grep -Fqx "$AWS_ACCOUNT_ID"

      - name: Initialize the remote backend
        run: terraform -chdir=infrastructure/terraform init -input=false -no-color

      - name: Identify the encrypted artifact
        id: identify
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="terraform-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Create and protect the production plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ ! ${TF_VAR_developer_ssh_cidr:-} =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/32$ ]]; then
            echo "::error::The production-plan environment must define DEVELOPER_SSH_CIDR as one IPv4 /32."
            exit 1
          fi

          plan_directory="${RUNNER_TEMP}/terraform-plan"
          plan_file="${plan_directory}/production.tfplan"
          plan_json="${plan_directory}/production.tfplan.json"
          plan_log="${plan_directory}/terraform-plan.log"
          summary_file="${plan_directory}/summary.md"
          key_response="${plan_directory}/data-key.json"
          plaintext_key="${plan_directory}/data-key.plaintext"
          install -d -m 0700 "$plan_directory"

          cleanup_plaintext() {
            rm -f -- "$plan_file" "$plan_json" "$plan_log" "$summary_file" \
              "$key_response" "$plaintext_key"
          }
          trap cleanup_plaintext EXIT

          set +e
          terraform -chdir=infrastructure/terraform plan \
            -detailed-exitcode \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out="$plan_file" \
            >"$plan_log" 2>&1
          plan_status=$?
          set -e

          case "$plan_status" in
            0)
              printf 'has_changes=false\n' >> "$GITHUB_OUTPUT"
              {
                echo '### Terraform plan safety gate'
                echo
                echo 'No infrastructure changes were detected; application deployment may continue without apply.'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              if ! terraform -chdir=infrastructure/terraform show -json "$plan_file" \
                >"$plan_json" 2>"$plan_log"; then
                echo "::error::The saved Terraform plan could not be inspected; details are withheld from logs."
                exit 1
              fi
              if ! node scripts/terraformDeployment.js analyze "$plan_json" "$summary_file"; then
                cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

              encryption_context="Repository=${GITHUB_REPOSITORY},Commit=${GITHUB_SHA},RunId=${GITHUB_RUN_ID},RunAttempt=${GITHUB_RUN_ATTEMPT},Purpose=TerraformPlan"
              aws kms generate-data-key \
                --key-id alias/TrackFusionWeb-Terraform-Plans \
                --key-spec AES_256 \
                --encryption-context "$encryption_context" \
                --output json > "$key_response"
              jq -er '.Plaintext' "$key_response" | base64 --decode > "$plaintext_key"
              jq -er '.CiphertextBlob' "$key_response" | base64 --decode \
                > "${plan_directory}/data-key.ciphertext"

              node scripts/terraformDeployment.js metadata-create \
                "$plan_file" "${plan_directory}/metadata.json"
              node scripts/terraformDeployment.js encrypt \
                "$plan_file" "${plan_directory}/production.tfplan.encrypted" "$plaintext_key"
              printf 'has_changes=true\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Terraform planning failed; details are withheld because plan diagnostics can contain sensitive values."
              exit 1
              ;;
          esac

      - name: Upload the encrypted reviewed plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identify.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/terraform-plan/production.tfplan.encrypted
            ${{ runner.temp }}/terraform-plan/data-key.ciphertext
            ${{ runner.temp }}/terraform-plan/metadata.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove plan files from the runner
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/terraform-plan"

  terraform-apply:
    name: Apply reviewed production plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: terraform-plan
    if: needs.terraform-plan.outputs.has_changes == 'true'
    environment:
      name: production-infrastructure
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "020457827871"
      TERRAFORM_VERSION: 1.17.0
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out the exact planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure reviewer-gated Terraform credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/TrackFusionWeb-GitHub-Terraform-Apply_Role
          role-session-name: TrackFusionWeb-Apply-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Account --output text | grep -Fqx "$AWS_ACCOUNT_ID"

      - name: Initialize the remote backend
        run: terraform -chdir=infrastructure/terraform init -input=false -no-color

      - name: Download the encrypted reviewed plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.terraform-plan.outputs.artifact_name }}
          path: ${{ runner.temp }}/approved-terraform-plan

      - name: Verify, decrypt, and apply the reviewed plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plan_directory="${RUNNER_TEMP}/approved-terraform-plan"
          encrypted_plan="${plan_directory}/production.tfplan.encrypted"
          encrypted_key="${plan_directory}/data-key.ciphertext"
          metadata="${plan_directory}/metadata.json"
          plaintext_key="${plan_directory}/data-key.plaintext"
          plaintext_key_base64="${plan_directory}/data-key.base64"
          plan_file="${plan_directory}/production.tfplan"
          plan_json="${plan_directory}/production.tfplan.json"
          summary_file="${plan_directory}/summary.md"
          apply_log="${plan_directory}/terraform-apply.log"

          for required_file in "$encrypted_plan" "$encrypted_key" "$metadata"; do
            if [[ ! -f $required_file || -L $required_file ]]; then
              echo "::error::The encrypted Terraform plan artifact is incomplete or unsafe."
              exit 1
            fi
          done

          cleanup_plaintext() {
            rm -f -- "$plaintext_key" "$plaintext_key_base64" "$plan_file" \
              "$plan_json" "$summary_file" "$apply_log"
          }
          trap cleanup_plaintext EXIT

          node scripts/terraformDeployment.js metadata-verify "$metadata"
          encryption_context="Repository=${GITHUB_REPOSITORY},Commit=${GITHUB_SHA},RunId=${GITHUB_RUN_ID},RunAttempt=${GITHUB_RUN_ATTEMPT},Purpose=TerraformPlan"
          aws kms decrypt \
            --key-id alias/TrackFusionWeb-Terraform-Plans \
            --ciphertext-blob "fileb://${encrypted_key}" \
            --encryption-context "$encryption_context" \
            --query Plaintext \
            --output text > "$plaintext_key_base64"
          base64 --decode "$plaintext_key_base64" > "$plaintext_key"

          node scripts/terraformDeployment.js decrypt \
            "$encrypted_plan" "$plan_file" "$plaintext_key"
          node scripts/terraformDeployment.js metadata-verify "$metadata" "$plan_file"

          if ! terraform -chdir=infrastructure/terraform show -json "$plan_file" \
            >"$plan_json" 2>"$apply_log"; then
            echo "::error::The decrypted Terraform plan could not be inspected; apply is blocked."
            exit 1
          fi
          if ! node scripts/terraformDeployment.js analyze "$plan_json" "$summary_file"; then
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

          if ! terraform -chdir=infrastructure/terraform apply \
            -auto-approve \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            "$plan_file" \
            >"$apply_log" 2>&1; then
            echo "::error::Terraform apply failed; application deployment is blocked and sensitive diagnostics remain off the log."
            exit 1
          fi

      - name: Remove plan files from the runner
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/approved-terraform-plan"

  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [terraform-plan, terraform-apply]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.result == 'success' &&
      (needs.terraform-plan.outputs.has_changes == 'false' || needs.terraform-apply.result == 'success')
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "020457827871"
      INSTANCE_ID: i-003f490e99fd1054d
      DEPLOYMENT_BUCKET: trackfusionweb-audio.s3bucket-020457827871-us-east-1-an
      API_BASE_URL: https://api.trackfusionweb.com
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/TrackFusionWeb-GitHub-Deploy_Role
          role-session-name: TrackFusionWeb-API-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Package and upload the release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trackfusionweb-${GITHUB_SHA}.tar.gz"
          object_key="deployments/${GITHUB_SHA}.tar.gz"
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=.aws \
            --exclude=.terraform \
            --exclude=terraform.tfvars \
            --exclude=node_modules \
            --exclude=venv \
            --exclude=coverage \
            --exclude='**/__pycache__' \
            --exclude='**/*.pyc' \
            --exclude=uploads \
            -czf "$archive" .
          checksum="$(sha256sum "$archive" | cut -d ' ' -f1)"
          aws s3 cp "$archive" "s3://${DEPLOYMENT_BUCKET}/${object_key}" --sse AES256
          printf 'object_key=%s\nchecksum=%s\n' "$object_key" "$checksum" >> "$GITHUB_OUTPUT"

      - name: Deploy through Systems Manager
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name TrackFusionWeb-Deploy \
            --comment "TrackFusionWeb API ${GITHUB_SHA}" \
            --parameters \
              "BucketName=${DEPLOYMENT_BUCKET},ObjectKey=${{ steps.release.outputs.object_key }},Checksum=${{ steps.release.outputs.checksum }},ReleaseId=${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"
          printf 'command_id=%s\n' "$command_id" >> "$GITHUB_OUTPUT"
          show_ssm_result() {
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
          }
          ssm_succeeded=false
          for wait_attempt in {1..9}; do
            if aws ssm wait command-executed \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID"; then
              ssm_succeeded=true
              break
            fi

            command_status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || printf 'Unavailable')"
            case "$command_status" in
              Pending|InProgress|Delayed)
                echo "SSM deployment is still running (wait cycle ${wait_attempt}/9)."
                ;;
              Success)
                ssm_succeeded=true
                break
                ;;
              *)
                echo "::error::The EC2 installation or health check failed with SSM status: ${command_status}."
                show_ssm_result || true
                exit 1
                ;;
            esac
          done
          if [[ "$ssm_succeeded" != true ]]; then
            echo "::error::The EC2 installation did not finish within the 15-minute SSM command timeout."
            show_ssm_result || true
            exit 1
          fi
          show_ssm_result

      - name: Verify the public HTTPS endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' --tlsv1.2 "${API_BASE_URL}/health"
          curl -fsS --proto '=https' --tlsv1.2 "${API_BASE_URL}/auth/session"
          curl -fsS --proto '=https' --tlsv1.2 "${API_BASE_URL}/tracks/public"
          curl -fsS --proto '=https' --tlsv1.2 "${API_BASE_URL}/enums/trackAttributes"

      - name: Remove the deployment artifact
        if: always() && steps.release.outputs.object_key != ''
        run: aws s3 rm "s3://${DEPLOYMENT_BUCKET}/${{ steps.release.outputs.object_key }}"
