name: trackfusionweb

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: trackfusionweb_db
      POSTGRES_USER: trackfusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackfusion -d trackfusionweb_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.51
    command: ["mini", "-dir=/data", "-ip=storage", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: trackfusion-local
      AWS_SECRET_ACCESS_KEY: trackfusion-local-secret
      S3_BUCKET: trackfusionweb-local
    volumes:
      - storage_data:/data
    ports:
      - "127.0.0.1:9000:8333"
    restart: unless-stopped

  storage-init:
    build:
      context: .
      target: runtime
    environment:
      STORAGE_PROVIDER: s3-compatible
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: trackfusionweb-local
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      STORAGE_ACCESS_KEY_ID: trackfusion-local
      STORAGE_SECRET_ACCESS_KEY: trackfusion-local-secret
      STORAGE_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: trackfusionweb-local
    depends_on:
      - storage
    command: ["node", "scripts/initStorage.js"]
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgresql://trackfusion:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/trackfusionweb_db
      REDIS_URL: redis://redis:6379
      PYTHON_EXECUTABLE: /opt/venv/bin/python
      AWS_PROFILE: ""
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      STORAGE_PROVIDER: s3-compatible
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: trackfusionweb-local
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      STORAGE_ACCESS_KEY_ID: trackfusion-local
      STORAGE_SECRET_ACCESS_KEY: trackfusion-local-secret
      STORAGE_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "node scripts/initDatabase.js && exec node index.js"]
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
