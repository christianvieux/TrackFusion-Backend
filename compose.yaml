name: trackfusionweb

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: trackfusionweb_db
      POSTGRES_USER: trackfusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackfusion -d trackfusionweb_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgresql://trackfusion:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/trackfusionweb_db
      REDIS_URL: redis://redis:6379
      PYTHON_EXECUTABLE: /opt/venv/bin/python
      AWS_PROFILE: ""
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/initDatabase.js && exec node index.js"]
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

