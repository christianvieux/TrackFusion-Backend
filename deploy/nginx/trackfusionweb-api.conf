server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.trackfusionweb.com;

    client_max_body_size 10m;

    # Keep the ACME challenge reachable over HTTP for initial issuance and renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # setup-https.sh creates this non-secret marker only after TLS is healthy.
        if (-f /etc/nginx/trackfusionweb-api-https-enabled) {
            return 301 https://api.trackfusionweb.com$request_uri;
        }

        include /etc/nginx/snippets/trackfusionweb-api-proxy.conf;
    }
}
