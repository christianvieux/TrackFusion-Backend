server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.trackfusionweb.com;

    ssl_certificate /etc/letsencrypt/live/api.trackfusionweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.trackfusionweb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TrackFusionWebTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    # These legacy API contracts carry a reset token in the path. Do not write
    # those paths to the Nginx access log.
    location ~ ^/auth/(reset-password|verify-reset-token)/[^/]+$ {
        access_log off;
        include /etc/nginx/snippets/trackfusionweb-api-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/trackfusionweb-api-proxy.conf;
    }
}
